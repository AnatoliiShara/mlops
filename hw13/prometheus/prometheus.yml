global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'book-recommendation-system'
    environment: 'development'

# Load recording and alerting rules
rule_files:
  - "recording_rules.yml"
  - "alert_rules.yml"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # Uncomment if you have Alertmanager
          # - alertmanager:9093

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s
    metrics_path: '/metrics'
    scrape_timeout: 10s

  # Book Recommendation App - Primary metrics
  - job_name: 'book-recommendation-app'
    static_configs:
      - targets: ['book-app:8080']
    scrape_interval: 5s  # High frequency for ML metrics
    metrics_path: '/metrics'
    scrape_timeout: 10s
    metric_relabel_configs:
      # Add custom labels
      - source_labels: [__name__]
        regex: 'book_.*'
        target_label: 'service'
        replacement: 'book-recommendation'
      # Rename long metric names
      - source_labels: [__name__]
        regex: 'book_search_duration_seconds_bucket'
        target_label: '__name__'
        replacement: 'search_latency_bucket'

  # Dagster - Pipeline and drift detection metrics
  - job_name: 'dagster-webserver'
    static_configs:
      - targets: ['dagster-webserver:3070']
    scrape_interval: 30s
    metrics_path: '/metrics'
    scrape_timeout: 15s
    honor_labels: true

  - job_name: 'dagster-daemon'
    static_configs:
      - targets: ['dagster-daemon:3070']
    scrape_interval: 30s
    metrics_path: '/metrics'
    scrape_timeout: 15s
    honor_labels: true

  # PostgreSQL - Database metrics (if postgres_exporter is configured)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s
    metrics_path: '/metrics'
    scrape_timeout: 10s
    honor_labels: true

  # SigNoz - Observability metrics
  - job_name: 'signoz'
    static_configs:
      - targets: ['signoz:4318']
    scrape_interval: 15s
    metrics_path: '/metrics'
    scrape_timeout: 10s
    honor_labels: true

  # Grafana - Dashboard metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    scrape_interval: 60s
    metrics_path: '/metrics'
    scrape_timeout: 10s
    honor_labels: true

  # System metrics (if node_exporter is available)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
    metrics_path: '/metrics'
    scrape_timeout: 10s
    honor_labels: true

  # Docker metrics (if cadvisor is available)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s
    metrics_path: '/metrics'
    scrape_timeout: 15s
    honor_labels: true

# Storage configuration
storage:
  tsdb:
    path: /prometheus
    retention.time: 15d
    retention.size: 50GB
    wal-compression: true

# Remote write configuration (for production)
# remote_write:
#   - url: "https://prometheus-remote-write-endpoint"
#     queue_config:
#       max_samples_per_send: 1000
#       max_shards: 200
#       capacity: 2500
groups:
  - name: book_recommendation_critical_alerts
    rules:
      - alert: SearchLatencyHigh
        expr: book:search_latency:p95_5m > 3
        for: 2m
        labels:
          severity: warning
          team: ml-ops
          component: search-pipeline
          priority: high
        annotations:
          summary: "High search latency detected"
          description: "P95 search latency is {{ $value | humanizeDuration }} (threshold: 3s)"
          runbook_url: "https://runbooks.company.com/search-latency"

      - alert: SearchLatencyCritical
        expr: book:search_latency:p95_5m > 5
        for: 1m
        labels:
          severity: critical
          team: ml-ops
          component: search-pipeline
          priority: critical
        annotations:
          summary: "Critical search latency detected"
          description: "P95 search latency is {{ $value | humanizeDuration }} (critical threshold: 5s)"
          runbook_url: "https://runbooks.company.com/search-latency-critical"

      - alert: HighErrorRate
        expr: book:error_rate:5m > 5
        for: 1m
        labels:
          severity: critical
          team: ml-ops
          component: application
          priority: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | printf \"%.1f\" }} errors/minute (threshold: 5/min)"
          runbook_url: "https://runbooks.company.com/high-error-rate"

      - alert: ErrorRatioHigh
        expr: book:error_ratio:5m > 0.1
        for: 2m
        labels:
          severity: warning
          team: ml-ops
          component: application
          priority: high
        annotations:
          summary: "High error ratio detected"
          description: "{{ $value | humanizePercentage }} of requests are failing (threshold: 10%)"

      - alert: ServiceDown
        expr: system:service_up == 0
        for: 30s
        labels:
          severity: critical
          team: platform
          priority: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} on {{ $labels.instance }} has been down for more than 30 seconds"
          runbook_url: "https://runbooks.company.com/service-down"

  - name: book_recommendation_performance_alerts
    rules:
      - alert: ComponentLatencyHigh
        expr: |
          (
            book:component_latency:bm25_p95_5m > 1 or
            book:component_latency:faiss_p95_5m > 1 or  
            book:component_latency:rerank_p95_5m > 2
          )
        for: 3m
        labels:
          severity: warning
          team: ml-ops
          component: "{{ $labels.component }}"
          priority: medium
        annotations:
          summary: "ML component latency is high"
          description: "{{ $labels.component }} component P95 latency is {{ $value | humanizeDuration }}"

      - alert: LowUserSatisfaction
        expr: book:satisfaction:current < 0.7
        for: 5m
        labels:
          severity: warning
          team: product
          component: recommendations
          priority: high
        annotations:
          summary: "User satisfaction is low"
          description: "User satisfaction rate is {{ $value | humanizePercentage }} (threshold: 70%)"
          runbook_url: "https://runbooks.company.com/low-satisfaction"

      - alert: VeryLowUserSatisfaction
        expr: book:satisfaction:current < 0.5
        for: 2m
        labels:
          severity: critical
          team: product
          component: recommendations
          priority: critical
        annotations:
          summary: "User satisfaction is critically low"
          description: "User satisfaction rate is {{ $value | humanizePercentage }} (critical threshold: 50%)"

      - alert: HighMemoryUsage
        expr: book:memory_usage:gb > 4
        for: 3m
        labels:
          severity: warning
          team: platform
          component: system
          priority: medium
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value | printf \"%.1f\" }}GB (threshold: 4GB)"

      - alert: CriticalMemoryUsage
        expr: book:memory_usage:gb > 6
        for: 1m
        labels:
          severity: critical
          team: platform
          component: system
          priority: critical
        annotations:
          summary: "Critical memory usage detected"
          description: "Memory usage is {{ $value | printf \"%.1f\" }}GB (critical threshold: 6GB)"

  - name: book_recommendation_business_alerts
    rules:
      - alert: NoSearchActivity
        expr: book:request_rate:5m < 0.1
        for: 10m
        labels:
          severity: warning
          team: product
          component: user-activity
          priority: medium
        annotations:
          summary: "Very low search activity"
          description: "Search activity is {{ $value | printf \"%.2f\" }} requests/minute (threshold: 0.1/min)"

      - alert: SearchActivityStopped
        expr: book:request_rate:5m == 0
        for: 5m
        labels:
          severity: critical
          team: product
          component: user-activity
          priority: high
        annotations:
          summary: "Search activity has stopped"
          description: "No search requests detected in the last 5 minutes"

      - alert: LowRecommendationQuality
        expr: book:results_count:p95_5m < 3
        for: 10m
        labels:
          severity: warning
          team: ml-ops
          component: recommendations
          priority: medium
        annotations:
          summary: "Low recommendation count"
          description: "P95 results count is {{ $value | printf \"%.1f\" }} (threshold: 3 results)"

      - alert: RecommendationSystemFailure
        expr: book:results_count:p95_5m == 0
        for: 2m
        labels:
          severity: critical
          team: ml-ops
          component: recommendations
          priority: critical
        annotations:
          summary: "Recommendation system returning no results"
          description: "P95 results count is 0 - recommendation system may be failing"

  - name: drift_detection_alerts
    rules:
      - alert: DriftDetectionPipelineDown
        expr: drift:pipeline_health == 0
        for: 2m
        labels:
          severity: critical
          team: ml-ops
          component: drift-detection
          priority: high
        annotations:
          summary: "Drift detection pipeline is down"
          description: "Dagster drift detection pipeline is not operational"
          runbook_url: "https://runbooks.company.com/drift-pipeline-down"

      - alert: HighInputDrift
        expr: drift:input_drift_score > 0.7
        for: 5m
        labels:
          severity: warning
          team: ml-ops
          component: model-quality
          priority: high
        annotations:
          summary: "High input drift detected"
          description: "Input drift score is {{ $value | printf \"%.2f\" }} (threshold: 0.7)"
          runbook_url: "https://runbooks.company.com/input-drift"

      - alert: HighOutputDrift
        expr: drift:output_drift_score > 0.7
        for: 5m
        labels:
          severity: warning
          team: ml-ops
          component: model-quality
          priority: high
        annotations:
          summary: "High output drift detected"
          description: "Output drift score is {{ $value | printf \"%.2f\" }} (threshold: 0.7)"
          runbook_url: "https://runbooks.company.com/output-drift"

      - alert: CriticalDriftDetected
        expr: |
          (
            drift:input_drift_score > 0.9 or 
            drift:output_drift_score > 0.9
          )
        for: 2m
        labels:
          severity: critical
          team: ml-ops
          component: model-quality
          priority: critical
        annotations:
          summary: "Critical drift detected - model retraining required"
          description: "Critical drift detected (score > 0.9) - immediate model review required"

  - name: system_health_alerts
    rules:
      - alert: ServiceUptimeLow
        expr: system:uptime_24h < 95
        for: 1m
        labels:
          severity: warning
          team: platform
          component: availability
          priority: medium
        annotations:
          summary: "Service uptime is low"
          description: "{{ $labels.job }} uptime is {{ $value | printf \"%.1f\" }}% in last 24h (threshold: 95%)"

      - alert: DataFreshnessIssue
        expr: system:data_freshness > 300
        for: 1m
        labels:
          severity: warning
          team: platform
          component: monitoring
          priority: low
        annotations:
          summary: "Monitoring data is stale"
          description: "Last successful scrape was {{ $value | humanizeDuration }} ago (threshold: 5m)"

  - name: ml_pipeline_alerts
    rules:
      - alert: MLPipelineInefficient
        expr: ml:pipeline_efficiency:5m > 1.5
        for: 5m
        labels:
          severity: warning
          team: ml-ops
          component: ml-pipeline
          priority: medium
        annotations:
          summary: "ML pipeline is inefficient"
          description: "Pipeline efficiency ratio is {{ $value | printf \"%.2f\" }} (threshold: 1.5)"

      - alert: LowSearchSuccessRate
        expr: ml:search_success_rate:5m < 0.95
        for: 3m
        labels:
          severity: warning
          team: ml-ops
          component: search-pipeline
          priority: high
        annotations:
          summary: "Low search success rate"
          description: "Search success rate is {{ $value | humanizePercentage }} (threshold: 95%)"

      - alert: LowRecommendationQualityScore
        expr: ml:recommendation_quality:5m < 0.6
        for: 10m
        labels:
          severity: warning
          team: ml-ops
          component: recommendations
          priority: medium
        annotations:
          summary: "Low recommendation quality score"
          description: "Recommendation quality score is {{ $value | printf \"%.2f\" }} (threshold: 0.6)"
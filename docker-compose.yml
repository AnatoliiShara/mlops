version: '3.8'

networks:
  monitoring:
    driver: bridge

volumes:
  signoz_data:
  prometheus_data:
  grafana_data:
  postgres_data:
  dagster_data:

services:
  # PostgreSQL - Dagster storage backend
  postgres:
    image: postgres:13
    container_name: postgres-dagster
    environment:
      POSTGRES_USER: dagster
      POSTGRES_PASSWORD: dagster
      POSTGRES_DB: dagster
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagster"]
      interval: 30s
      timeout: 10s
      retries: 3

  # SigNoz - All-in-one observability platform
  signoz:
    image: signoz/signoz:0.37.0
    container_name: signoz
    ports:
      - "3301:3301"    # SigNoz UI
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
    environment:
      - DOCKER_MULTI_NODE_DEPLOYMENT=false
      - SIGNOZ_LOCAL_DB_PATH=/var/lib/signoz
    volumes:
      - signoz_data:/var/lib/signoz
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3301"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    ports:
      - "9090:9090"    # Prometheus UI
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana
    ports:
      - "3000:3000"    # Grafana UI
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
    networks:
      - monitoring
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Dagster Daemon - Pipeline orchestration
  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: dagster-daemon
    environment:
      DAGSTER_POSTGRES_USER: dagster
      DAGSTER_POSTGRES_PASSWORD: dagster
      DAGSTER_POSTGRES_DB: dagster
      DAGSTER_POSTGRES_HOST: postgres
      DAGSTER_POSTGRES_PORT: 5432
      PROJECT_ROOT: /data
      OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz:4317
      PROMETHEUS_GATEWAY: http://prometheus:9090
    volumes:
      - /home/anatolii-shara/Documents/projector_capstone_project:/data:ro
      - dagster_data:/tmp/dagster
      - ./data:/app/data
    networks:
      - monitoring
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: ["dagster-daemon", "run"]

  # Dagster Web UI
  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: dagster-webserver
    ports:
      - "3070:3070"    # Dagster UI
    environment:
      DAGSTER_POSTGRES_USER: dagster
      DAGSTER_POSTGRES_PASSWORD: dagster
      DAGSTER_POSTGRES_DB: dagster
      DAGSTER_POSTGRES_HOST: postgres
      DAGSTER_POSTGRES_PORT: 5432
      PROJECT_ROOT: /data
    volumes:
      - /home/anatolii-shara/Documents/projector_capstone_project:/data:ro
      - dagster_data:/tmp/dagster
      - ./data:/app/data
    networks:
      - monitoring
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: ["dagster-webserver", "--host", "0.0.0.0", "--port", "3070"]

  # Book Recommendation App with complete monitoring
  book-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: book-recommendation-app
    ports:
      - "7860:7860"    # Gradio UI
      - "8080:8080"    # Prometheus metrics endpoint
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://signoz:4317
      - OTEL_SERVICE_NAME=book-recommendation-system
      - OTEL_SERVICE_VERSION=1.0.0
      - OTEL_RESOURCE_ATTRIBUTES=service.name=book-recommendation-system,environment=development
      - PROJECT_ROOT=/data
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - PROMETHEUS_PORT=8080
      - DAGSTER_POSTGRES_HOST=postgres
      - DAGSTER_POSTGRES_USER=dagster
      - DAGSTER_POSTGRES_PASSWORD=dagster
      - DAGSTER_POSTGRES_DB=dagster
    volumes:
      - /home/anatolii-shara/Documents/projector_capstone_project:/data:ro
      - dagster_data:/tmp/dagster
      - ./data:/app/data
    networks:
      - monitoring
    depends_on:
      signoz:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860"] 
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s